name: Package release

on:
  workflow_call:

concurrency:
  group: package-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify LFS assets
        run: git lfs fsck
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Set up Python and dependencies
        run: uv sync --frozen
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+_\d+\.\d+\.\d+\.\d+$') {
            throw "VERSION must use the Ankama X.Y_A.B.C.D format, got: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows package
        run: uv run poe package
      - name: Validate packaged startup and shutdown
        run: uv run python -m scripts.packaging.validate_package dist/AstraBot
      - name: Create release archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AstraBot -DestinationPath dist/AstraBot-${{ steps.version.outputs.version }}.zip -CompressionLevel Optimal
          $asset = Get-Item dist/AstraBot-${{ steps.version.outputs.version }}.zip
          if ($asset.Length -gt 2GB) {
            throw "Release asset exceeds the 2 GiB GitHub limit: $($asset.Length) bytes"
          }
      - name: Replace latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $releases = gh release list --limit 1000 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Failed to list releases" }
          if ($releases.tagName -contains 'latest') {
            gh release delete latest --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete the previous latest release" }
          }
          gh release create latest "dist/AstraBot-$env:RELEASE_VERSION.zip" --target $env:GITHUB_SHA --title $env:RELEASE_VERSION --notes "Version $env:RELEASE_VERSION" --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish the latest release" }
