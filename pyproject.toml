[project]
name = "itsbillbot"
version = "0.1.0"
description = "Python framework for Dofus Unity protocol research and bot orchestration."
authors = [{ name = "Valentin Alix" }]
requires-python = ">3.12,<3.13"
readme = "README.md"

dependencies = [
    "psutil==7.2.2",
    "msgspec==0.22.0",
    "protobuf==5.28.3",
    "schedule==1.2.2",
    "python-dotenv==1.2.4",
    "pycryptodomex==3.23.0",
    "thrift==0.24.0",
    "wmi==1.5.1",
    "pysocks==1.7.1",
    "pydantic==2.13.5",
    "playwright==1.63.0",
    "requests[socks]==2.34.0",
    "pyqt6-fluent-widgets==1.11.3",
    "frida==17.20.0",
    "filelock==4.0.9",
]

[dependency-groups]
dev = [
    "cython==3.2.9",
    "setuptools>=80",
    "idapro>=0.0.7",
    "scapy==2.7.0",
    "cachetools==7.2.0",
    "pulp[cbc]==4.0.0",
    "vulture==2.16",
    "frida-tools==14.10.4",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pyinstaller>=6.19.0,<7",
    "ruff>=0.15.12",
    "poethepoet>=0.44.0",
    "pyright>=1.1.408",
    "PyQt6-stubs>=6.6.0",
    "types-cachetools>=5.5.0.20240820",
    "tqdm>=4.66.5,<5",
    "coverage>=7.13.1",
    "pytest>=9.0.3",
    "types-psutil>=7.1.3.20251211",
    "types-protobuf>=6.32.1.20251210",
    "types-requests>=2.32.4.20250913,<3",
    "scipy-stubs>=1.18,<2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poe.tasks]
dead_code = "vulture src AnkamaLauncherEmulator/ankama_launcher_emulator DBDofusUnity/dofus_unity_reader DBDofusUnity/proto_mapper_assembly scripts --exclude \"*gen_zaap*,*proxy/login_message_pb2.py\" --min-confidence 80"
check_type = "pyright"
lint = "ruff check . private --fix"
format = "ruff format ."
check = ["lint", "check_type"]
test = "coverage run --source=src -m pytest tests"
test_verbose = "pytest tests -s"
verify = ["lint", "check_type", "test"]
package-browser = { cmd = "playwright install chromium --no-shell", env = { PLAYWRIGHT_BROWSERS_PATH = "0" } }
package = ["package-browser", "package-build"]
package-build = "pyinstaller --noconfirm --clean BillBot.spec"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "AnkamaLauncherEmulator", "DBDofusUnity"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-p", "no:langsmith_plugin"
]

[tool.ruff]
exclude = [
  "DBDofusUnity/datas",
  "DBDofusUnity/.venv",
  "DBDofusUnity/Il2CppInspectorRedux",
  "DBDofusUnity/protodec",
  "DBDofusUnity/UABEA",
  "AnkamaLauncherEmulator/ankama_launcher_emulator/gen_zaap",
  "AnkamaLauncherEmulator/ankama_launcher_emulator/proxy/login_message*",
  "**/.venv",
  "**/datas",
  "**/node_modules",
  "**/__pycache__",
  "**/.*"
]
line-length = 110

[tool.ruff.lint]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["INP001"]
