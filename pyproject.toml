[project]
name = "itsbillbot"
version = "0.1.0"
description = "Python framework for Dofus Unity protocol research and bot orchestration."
authors = [{ name = "Valentin Alix" }]
requires-python = ">=3.15.2,<3.16"
readme = "README.md"

dependencies = [
    "psutil==7.2.2",
    "msgspec==0.22.0",
    "protobuf==5.28.3",
    "schedule==1.2.2",
    "python-dotenv==1.2.4",
    "pycryptodomex==3.23.0",
    "thrift==0.24.0",
    "wmi==1.5.1",
    "pysocks==1.7.1",
    "pydantic==2.14.3",
    "playwright==1.63.0",
    "requests[socks]==2.34.0",
    "pyqt6-fluent-widgets==1.11.3",
    "frida==17.20.0",
    "filelock==4.0.9",
    "tuna>=0.5.15",
]

[dependency-groups]
dev = [
    "idapro>=0.0.7",
    "scapy==2.7.0",
    "cachetools==7.2.0",
    "pulp[cbc]==4.2.0",
    "vulture==2.16",
    "frida-tools==14.10.4",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pyinstaller>=6.21.0,<7",
    "ruff>=0.17.4",
    "poethepoet>=0.44.0",
    "pyright>=1.1.414",
    "PyQt6-stubs>=6.6.0",
    "types-cachetools>=5.5.0.20240820",
    "tqdm>=4.66.5,<5",
    "pytest>=9.0.3",
    "types-psutil>=7.1.3.20251211",
    "types-protobuf>=6.32.1.20251210",
    "types-requests>=2.32.4.20250913,<3",
    "scipy-stubs>=1.18,<2",
    "ty>=0.0.103",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]
constraint-dependencies = ["greenlet>=3.5.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poe.tasks]
dead_code = "vulture src AnkamaLauncherEmulator/ankama_launcher_emulator DBDofusUnity/dofus_unity_reader DBDofusUnity/proto_mapper_assembly scripts --exclude \"*gen_zaap*,*proxy/login_message_pb2.py\" --min-confidence 80"
check_type = "ty check"
lint = "ruff check src AnkamaLauncherEmulator DBDofusUnity scripts tests utils __main__.py --fix"
format = "ruff format ."
check = ["lint", "check_type"]
test = "pytest"
test_verbose = "pytest tests -s"
verify = ["lint", "check_type", "test"]
package-browser = { cmd = "playwright install chromium --no-shell", env = { PLAYWRIGHT_BROWSERS_PATH = "0" } }
package = ["package-browser", "package-build"]
package-build = "pyinstaller --noconfirm --clean BillBot.spec"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "AnkamaLauncherEmulator", "DBDofusUnity"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-p", "no:langsmith_plugin"
]

[tool.ty.environment]
python-version = "3.15"
python-platform = "win32"
extra-paths = [
    ".stubs",
    "DBDofusUnity/datas/protos/non_obf/game",
    "DBDofusUnity/datas/protos/non_obf/connection",
    "scripts/mapping/ida_tracer_lib/typings",
    "AnkamaLauncherEmulator",
    "DBDofusUnity",
]

[tool.ty.src]
include = [
    "__main__.py",
    "utils",
    "src",
    "AnkamaLauncherEmulator",
    "DBDofusUnity",
    "scripts",
    "tests",
]
exclude = [
    "private",
    "DBDofusUnity/datas/protos",
    "DBDofusUnity/datas/bundles",
    "DBDofusUnity/datas/proto_mapper",
    "DBDofusUnity/dofus_unity_reader/models/datas",
    "DBDofusUnity/Il2CppInspectorRedux",
    "DBDofusUnity/protodec",
    "DBDofusUnity/UABEA",
    "AnkamaLauncherEmulator/ankama_launcher_emulator/gen_zaap",
    "AnkamaLauncherEmulator/ankama_launcher_emulator/proxy/login_message_pb2.py*",
    "**/.venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]

[[tool.ty.overrides]]
include = ["src/gui/**"]

[tool.ty.overrides.analysis]
allowed-unresolved-imports = [
    "qfluentwidgets.common.config",
    "qfluentwidgets.components.widgets.progress_ring",
    "qfluentwidgets.components.dialog_box.dialog",
    "qfluentwidgets.components.widgets.label",
    "qfluentwidgets.components.widgets.check_box",
]

[tool.ruff]
target-version = "py315"
exclude = [
  "DBDofusUnity/datas",
  "DBDofusUnity/.venv",
  "DBDofusUnity/Il2CppInspectorRedux",
  "DBDofusUnity/protodec",
  "DBDofusUnity/UABEA",
  "AnkamaLauncherEmulator/ankama_launcher_emulator/gen_zaap",
  "AnkamaLauncherEmulator/ankama_launcher_emulator/proxy/login_message*",
  "**/.venv",
  "**/datas",
  "**/node_modules",
  "**/__pycache__",
  "**/.*"
]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["INP001"]
